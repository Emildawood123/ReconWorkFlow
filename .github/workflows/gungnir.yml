name: Wolt Gungnir Monitor

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Gungnir
        run: |
          go install github.com/g0ldencybersec/gungnir/cmd/gungnir@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run Gungnir
        run: |
          mkdir -p results
          timeout 40m gungnir -r roots.txt > results/raw.txt || true

      - name: Find new subdomains
        id: process
        run: |
          touch all_subs.txt
          cat results/raw.txt | grep -v '^$' | sort -u > results/clean.txt
          comm -13 <(sort -u all_subs.txt) results/clean.txt > results/new.txt
          NEW_COUNT=$(wc -l < results/new.txt)
          echo "NEW_COUNT=$NEW_COUNT" >> $GITHUB_OUTPUT
          if [ "$NEW_COUNT" -gt 0 ]; then
            cat results/clean.txt >> all_subs.txt
            sort -u all_subs.txt -o all_subs.txt
          fi

      - name: Send to Telegram (TEST)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Bot Token exists: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}"
          echo "Chat ID exists: ${{ secrets.TELEGRAM_CHAT_ID != '' }}"
          
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Gungnir Test Successful - $(date)")
          
          echo "Telegram Response:"
          echo "$RESPONSE"

      - name: Commit history
        if: steps.process.outputs.NEW_COUNT != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all_subs.txt
          git commit -m "Update wolt.com subdomains" || echo "No changes"
          git push
