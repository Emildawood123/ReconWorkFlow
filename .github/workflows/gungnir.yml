name: Wolt Gungnir Monitor

on:
  schedule:
    # 5:55 PM Egypt time (UTC+3) - reminder
    - cron: '55 14 * * *'

    # 6:00 PM Egypt time (UTC+3) - Gungnir scan
    - cron: '0 15 * * *'

  workflow_dispatch:

jobs:
  reminder:
    if: github.event_name == 'schedule' && github.event.schedule == '55 14 * * *'
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram Reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🔔 Wolt Gungnir Monitor starts in 5 minutes%0A%0A⏰ Time: 6:00 PM Egypt%0A🎯 Target: Wolt"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d disable_web_page_preview=true


  monitor:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 15 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Gungnir
        run: |
          go install github.com/g0ldencybersec/gungnir/cmd/gungnir@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Run Gungnir
        run: |
          mkdir -p results
          timeout 40m gungnir -r root.txt > results/raw.txt || true

      - name: Find new subdomains
        id: process
        run: |
          touch all_subs.txt

          cat results/raw.txt \
            | grep -v '^$' \
            | sort -u \
            > results/clean.txt

          comm -13 \
            <(sort -u all_subs.txt) \
            results/clean.txt \
            > results/new.txt

          NEW_COUNT=$(wc -l < results/new.txt)

          echo "NEW_COUNT=$NEW_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$NEW_COUNT" -gt 0 ]; then
            echo "Found $NEW_COUNT new subdomains"
            cat results/new.txt

            cat results/clean.txt >> all_subs.txt
            sort -u all_subs.txt -o all_subs.txt
          else
            echo "No new subdomains found"
          fi

      - name: Send to Telegram
        if: steps.process.outputs.NEW_COUNT != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🚨 New Wolt Subdomains - $(date +%Y-%m-%d)%0A%0A$(cat results/new.txt | sed ':a;N;$!ba;s/\n/%0A/g')"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d disable_web_page_preview=true

      - name: Commit history
        if: steps.process.outputs.NEW_COUNT != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add all_subs.txt

          git commit \
            -m "Update wolt.com subdomains - $(date +%Y-%m-%d)" \
            || echo "No changes"

          git push
