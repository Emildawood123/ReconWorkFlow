name: Wolt Gungnir Monitor

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Gungnir
        run: |
          go install github.com/g0ldencybersec/gungnir/cmd/gungnir@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run Gungnir
        run: |
          mkdir -p results
          timeout 40m gungnir -r roots.txt > results/raw.txt || true

      - name: Find new subdomains
        id: process
        run: |
          DATE=$(date +%Y-%m-%d)
          touch all_subs.txt

          cat results/raw.txt | grep -v '^$' | sort -u > results/clean.txt
          comm -13 <(sort -u all_subs.txt) results/clean.txt > results/new.txt

          NEW_COUNT=$(wc -l < results/new.txt)
          echo "NEW_COUNT=$NEW_COUNT" >> $GITHUB_OUTPUT

          if [ "$NEW_COUNT" -gt 0 ]; then
            echo "Found $NEW_COUNT new subdomains for wolt.com"
            cat results/new.txt

            cat results/clean.txt >> all_subs.txt
            sort -u all_subs.txt -o all_subs.txt
          else
            echo "No new subdomains found"
          fi

      - name: Send to Telegram (TEST)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +%Y-%m-%d)

          if [ -s results/new.txt ]; then
            MESSAGE="🔥 New Wolt Subdomains - $DATE%0A%0A$(cat results/new.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
          else
            MESSAGE="✅ Gungnir Test Successful%0ADate: $DATE%0ATarget: wolt.com%0AStatus: No new subdomains found (this is normal)%0AWorkflow is working correctly 👍"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d disable_web_page_preview=true

      - name: Commit history
        if: steps.process.outputs.NEW_COUNT != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all_subs.txt
          git commit -m "Update wolt.com subdomains - $(date +%Y-%m-%d)" || echo "No changes"
          git push
