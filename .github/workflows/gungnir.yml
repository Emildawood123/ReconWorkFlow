
name: Passive Subdomain Monitor

on:
  schedule:
    - cron: '55 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.22'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install tools
        shell: bash
        run: |
          set -e

          echo "$HOME/go/bin" >> "$GITHUB_PATH"

          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/tomnomnom/assetfinder@latest
          go install github.com/owasp-amass/amass/v4/...@master

      - name: Prepare
        shell: bash
        run: |
          set -e

          mkdir -p results

          touch all_subs.txt
          touch resolved_subs.txt

          sed -i 's/\r//' root.txt
          sed -i '/^[[:space:]]*$/d' root.txt

          echo "Targets:"
          cat root.txt

      - name: Telegram reminder
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -e

          MESSAGE='🔔 Recon starts in 5 minutes

⏰ Scheduled scan: 6:00 PM Egypt
🎯 Passive subdomain monitoring'

          RESPONSE=$(curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "disable_web_page_preview=true")

          echo "$RESPONSE"

      - name: Wait 5 minutes
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          sleep 300

      - name: Telegram started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -e

          MESSAGE='🚀 Recon started

🔎 Subfinder
🔎 Amass passive
🔎 Assetfinder
🌐 DNS validation

⏳ Running passive discovery...'

          RESPONSE=$(curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "disable_web_page_preview=true")

          echo "$RESPONSE"

      - name: Passive discovery
        shell: bash
        run: |
          set +e

          mkdir -p results

          echo "Running Subfinder..."

          subfinder \
            -dL root.txt \
            -all \
            -silent \
            -o results/subfinder.txt \
            > results/subfinder.log 2>&1

          SUBFINDER_STATUS=$?

          echo "Running Amass passive..."

          amass enum \
            -passive \
            -df root.txt \
            -o results/amass.txt \
            > results/amass.log 2>&1

          AMASS_STATUS=$?

          echo "Running Assetfinder..."

          : > results/assetfinder.txt
          : > results/assetfinder.log

          while IFS= read -r domain; do
            if [ -n "$domain" ]; then
              assetfinder --subs-only "$domain" \
                >> results/assetfinder.txt \
                2>> results/assetfinder.log
            fi
          done < root.txt

          ASSETFINDER_STATUS=$?

          echo ""
          echo "================================"
          echo "Discovery status"
          echo "================================"
          echo "Subfinder:   $SUBFINDER_STATUS"
          echo "Amass:       $AMASS_STATUS"
          echo "Assetfinder: $ASSETFINDER_STATUS"
          echo "================================"

      - name: Combine discoveries
        shell: bash
        run: |
          set -e

          cat \
            results/subfinder.txt \
            results/amass.txt \
            results/assetfinder.txt \
            2>/dev/null \
            | sed 's/\r//' \
            | sed 's/^[[:space:]]*//' \
            | sed 's/[[:space:]]*$//' \
            | tr '[:upper:]' '[:lower:]' \
            | grep -E '^[a-z0-9*._-]+\.[a-z]{2,}$' \
            | sort -u \
            > results/discovered.txt

          DISCOVERED_COUNT=$(wc -l < results/discovered.txt | tr -d ' ')

          echo "================================"
          echo "Passive discovery complete"
          echo "Discovered: $DISCOVERED_COUNT"
          echo "================================"

      - name: DNS validation
        shell: bash
        run: |
          set +e

          if [ -s results/discovered.txt ]; then
            dnsx \
              -l results/discovered.txt \
              -silent \
              -o results/resolved.txt
          else
            : > results/resolved.txt
          fi

          sort -u results/resolved.txt -o results/resolved.txt

          RESOLVED_COUNT=$(wc -l < results/resolved.txt | tr -d ' ')

          echo "================================"
          echo "DNS validation complete"
          echo "Resolved: $RESOLVED_COUNT"
          echo "================================"

      - name: Find new subdomains
        id: process
        shell: bash
        run: |
          set -e

          sort -u all_subs.txt > results/history.txt

          comm \
            -13 \
            results/history.txt \
            results/discovered.txt \
            > results/new.txt

          DISCOVERED_COUNT=$(wc -l < results/discovered.txt | tr -d ' ')
          RESOLVED_COUNT=$(wc -l < results/resolved.txt | tr -d ' ')
          NEW_COUNT=$(wc -l < results/new.txt | tr -d ' ')

          echo "DISCOVERED_COUNT=$DISCOVERED_COUNT" >> "$GITHUB_OUTPUT"
          echo "RESOLVED_COUNT=$RESOLVED_COUNT" >> "$GITHUB_OUTPUT"
          echo "NEW_COUNT=$NEW_COUNT" >> "$GITHUB_OUTPUT"

          echo "================================"
          echo "FINAL RESULTS"
          echo "================================"
          echo "Discovered: $DISCOVERED_COUNT"
          echo "Resolved:   $RESOLVED_COUNT"
          echo "New:        $NEW_COUNT"
          echo "================================"

          echo ""
          echo "New subdomains:"
          cat results/new.txt || true

          # Save ALL discovered subdomains to history.
          cat results/discovered.txt >> all_subs.txt
          sort -u all_subs.txt -o all_subs.txt

          # Save resolving subdomains separately.
          cp results/resolved.txt resolved_subs.txt

      - name: Telegram final results
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -e

          NEW_COUNT="${{ steps.process.outputs.NEW_COUNT }}"
          DISCOVERED_COUNT="${{ steps.process.outputs.DISCOVERED_COUNT }}"
          RESOLVED_COUNT="${{ steps.process.outputs.RESOLVED_COUNT }}"

          if [ "$NEW_COUNT" -gt 0 ]; then

            MESSAGE="🚨 Recon completed

📊 Discovered: ${DISCOVERED_COUNT}
🌐 Resolved: ${RESOLVED_COUNT}
🆕 New: ${NEW_COUNT}

🆕 New subdomains:"

            while IFS= read -r sub; do
              MESSAGE="${MESSAGE}
${sub}"
            done < results/new.txt

          else

            MESSAGE="✅ Recon completed

📊 Discovered: ${DISCOVERED_COUNT}
🌐 Resolved: ${RESOLVED_COUNT}
🆕 New: 0

✅ No new subdomains found."

          fi

          echo "================================"
          echo "Telegram report"
          echo "================================"
          printf '%s\n' "$MESSAGE"
          echo "================================"

          RESPONSE=$(curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "disable_web_page_preview=true")

          echo "$RESPONSE"

          if ! echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Telegram notification failed"
            exit 1
          fi

          echo "Telegram notification sent successfully."

      - name: Commit history
        shell: bash
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add all_subs.txt resolved_subs.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Update subdomain history - $(date '+%Y-%m-%d')"

          git push

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-results-${{ github.run_number }}
          path: results/
          retention-days: 7

