name: Bug Bounty Subdomain Monitor

on:
  schedule:
    # 5:55 PM Egypt time (UTC+3)
    - cron: '55 14 * * *'

    # 6:00 PM Egypt time (UTC+3)
    - cron: '0 15 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:

  reminder:
    if: github.event_name == 'schedule' && github.event.schedule == '55 14 * * *'
    runs-on: ubuntu-latest

    steps:
      - name: Telegram Reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🔔 Recon starts in 5 minutes%0A%0A⏰ 6:00 PM Egypt%0A🎯 Passive subdomain monitoring"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d disable_web_page_preview=true


  monitor:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 15 * * *'

    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install tools
        run: |
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/tomnomnom/assetfinder@latest
          go install github.com/owasp-amass/amass/v4/...@master
          go install github.com/g0ldencybersec/gungnir/cmd/gungnir@latest

      - name: Prepare
        run: |
          mkdir -p results

          touch all_subs.txt

          echo "Targets:"
          cat root.txt


      - name: Subfinder
        run: |
          subfinder \
            -dL root.txt \
            -all \
            -silent \
            -o results/subfinder.txt \
            || true


      - name: Amass Passive
        run: |
          amass enum \
            -passive \
            -df root.txt \
            -o results/amass.txt \
            || true


      - name: Assetfinder
        run: |
          touch results/assetfinder.txt

          while IFS= read -r domain; do
            [ -z "$domain" ] && continue

            assetfinder \
              --subs-only "$domain" \
              >> results/assetfinder.txt \
              || true

          done < root.txt


      - name: Gungnir
        run: |
          timeout 40m \
            gungnir \
            -r root.txt \
            > results/gungnir.txt \
            || true


      - name: Combine discoveries
        run: |
          cat \
            results/subfinder.txt \
            results/amass.txt \
            results/assetfinder.txt \
            results/gungnir.txt \
            2>/dev/null \
            | sed 's/\r//' \
            | sed 's/^[[:space:]]*//' \
            | sed 's/[[:space:]]*$//' \
            | grep -v '^$' \
            | sort -u \
            > results/all_discovered.txt

          echo "Total unique discovered:"
          wc -l results/all_discovered.txt


      - name: DNS validation
        run: |
          dnsx \
            -l results/all_discovered.txt \
            -silent \
            -o results/resolved.txt \
            || true

          sort -u results/resolved.txt \
            > results/current.txt

          echo "Currently resolving:"
          wc -l results/current.txt


      - name: Find NEW subdomains
        id: process
        run: |
          sort -u all_subs.txt > results/old.txt

          comm -13 \
            results/old.txt \
            results/current.txt \
            > results/new.txt

          NEW_COUNT=$(wc -l < results/new.txt | tr -d ' ')

          echo "NEW_COUNT=$NEW_COUNT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "================================"
          echo "NEW SUBDOMAINS: $NEW_COUNT"
          echo "================================"

          if [ "$NEW_COUNT" -gt 0 ]; then
            cat results/new.txt

            cat results/current.txt >> all_subs.txt
            sort -u all_subs.txt -o all_subs.txt
          else
            echo "No new resolving subdomains."
          fi


      - name: Send Telegram
        if: steps.process.outputs.NEW_COUNT != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          NEW_COUNT="${{ steps.process.outputs.NEW_COUNT }}"

          MESSAGE="🚨 NEW SUBDOMAINS%0A%0A"
          MESSAGE="${MESSAGE}🎯 Targets: root.txt%0A"
          MESSAGE="${MESSAGE}📊 New: ${NEW_COUNT}%0A"
          MESSAGE="${MESSAGE}📅 $(date +%Y-%m-%d)%0A%0A"

          while IFS= read -r sub; do
            MESSAGE="${MESSAGE}${sub}%0A"
          done < results/new.txt

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d disable_web_page_preview=true


      - name: Commit history
        if: steps.process.outputs.NEW_COUNT != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add all_subs.txt

          git commit \
            -m "Update subdomain history - $(date +%Y-%m-%d)" \
            || echo "No changes"

          git push
