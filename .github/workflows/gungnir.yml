name: Bug Bounty Subdomain Monitor

on:
  schedule:
    # 5:55 PM Egypt time (UTC+3)
    - cron: '55 14 * * *'

    # 6:00 PM Egypt time (UTC+3)
    - cron: '0 15 * * *'

  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.22'

jobs:

  reminder:
    if: github.event_name == 'schedule' && github.event.schedule == '55 14 * * *'
    runs-on: ubuntu-latest

    steps:
      - name: Telegram reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔔 Recon starts in 5 minutes%0A%0A⏰ 6:00 PM Egypt%0A🎯 Scope: root.txt" \
            -d disable_web_page_preview=true


  monitor:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 15 * * *'

    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install tools
        shell: bash
        run: |
          set -e

          echo "$HOME/go/bin" >> "$GITHUB_PATH"

          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/tomnomnom/assetfinder@latest
          go install github.com/g0ldencybersec/gungnir/cmd/gungnir@latest

          # Amass
          go install github.com/owasp-amass/amass/v4/...@master

      - name: Prepare
        run: |
          mkdir -p results

          touch all_subs.txt
          touch resolved_subs.txt

          sed -i 's/\r//' root.txt

          echo "Targets:"
          cat root.txt

      - name: Telegram scan started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚀 Recon started%0A%0A⏰ $(date '+%H:%M:%S UTC')%0A🎯 Targets loaded from root.txt%0A%0A🔎 Running passive discovery..." \
            -d disable_web_page_preview=true

      # ---------------------------------------------------------
      # Run discovery sources in PARALLEL
      # ---------------------------------------------------------

      - name: Passive discovery
        shell: bash
        run: |
          set +e

          mkdir -p results

          echo "[+] Starting passive discovery..."

          (
            echo "[Subfinder] started"
            subfinder \
              -dL root.txt \
              -all \
              -silent \
              -o results/subfinder.txt
            echo "[Subfinder] finished"
          ) > results/subfinder.log 2>&1 &

          PID_SUBFINDER=$!

          (
            echo "[Amass] started"
            amass enum \
              -passive \
              -df root.txt \
              -o results/amass.txt
            echo "[Amass] finished"
          ) > results/amass.log 2>&1 &

          PID_AMASS=$!

          (
            echo "[Assetfinder] started"

            while IFS= read -r domain; do
              [ -z "$domain" ] && continue

              assetfinder --subs-only "$domain" || true

            done < root.txt

            echo "[Assetfinder] finished"
          ) > results/assetfinder.txt 2> results/assetfinder.log &

          PID_ASSETFINDER=$!

          (
            echo "[Gungnir] started"

            timeout 35m \
              gungnir -r root.txt

            echo "[Gungnir] finished"

          ) > results/gungnir.txt 2> results/gungnir.log &

          PID_GUNGNIR=$!

          echo "[+] All discovery jobs started"

          wait $PID_SUBFINDER
          SUBFINDER_STATUS=$?

          wait $PID_AMASS
          AMASS_STATUS=$?

          wait $PID_ASSETFINDER
          ASSETFINDER_STATUS=$?

          wait $PID_GUNGNIR
          GUNGNIR_STATUS=$?

          echo ""
          echo "=============================="
          echo "Discovery completed"
          echo "=============================="

          echo "Subfinder:    $SUBFINDER_STATUS"
          echo "Amass:        $AMASS_STATUS"
          echo "Assetfinder:  $ASSETFINDER_STATUS"
          echo "Gungnir:      $GUNGNIR_STATUS"

      # ---------------------------------------------------------
      # Combine everything
      # ---------------------------------------------------------

      - name: Deduplicate discoveries
        run: |
          cat \
            results/subfinder.txt \
            results/amass.txt \
            results/assetfinder.txt \
            results/gungnir.txt \
            2>/dev/null \
            | sed 's/\r//' \
            | sed 's/^[[:space:]]*//' \
            | sed 's/[[:space:]]*$//' \
            | grep -E '^[A-Za-z0-9*._-]+\.[A-Za-z]{2,}$' \
            | tr '[:upper:]' '[:lower:]' \
            | sort -u \
            > results/discovered.txt

          echo "Unique discovered:"
          wc -l results/discovered.txt

      # ---------------------------------------------------------
      # DNS validation
      # ---------------------------------------------------------

      - name: Resolve subdomains
        run: |
          if [ -s results/discovered.txt ]; then

            dnsx \
              -l results/discovered.txt \
              -silent \
              -resp \
              -o results/resolved_raw.txt \
              || true

            awk '{print $1}' results/resolved_raw.txt \
              | sort -u \
              > results/resolved.txt

          else
            touch results/resolved.txt
          fi

          echo "Resolving subdomains:"
          wc -l results/resolved.txt

      # ---------------------------------------------------------
      # Compare against historical database
      # ---------------------------------------------------------

      - name: Find new subdomains
        id: process
        shell: bash
        run: |
          sort -u all_subs.txt \
            > results/history.txt

          comm -13 \
            results/history.txt \
            results/resolved.txt \
            > results/new.txt

          NEW_COUNT=$(wc -l < results/new.txt | tr -d ' ')
          TOTAL_COUNT=$(wc -l < results/resolved.txt | tr -d ' ')
          DISCOVERED_COUNT=$(wc -l < results/discovered.txt | tr -d ' ')

          echo "NEW_COUNT=$NEW_COUNT" >> "$GITHUB_OUTPUT"
          echo "TOTAL_COUNT=$TOTAL_COUNT" >> "$GITHUB_OUTPUT"
          echo "DISCOVERED_COUNT=$DISCOVERED_COUNT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=============================="
          echo "Results"
          echo "=============================="
          echo "Discovered: $DISCOVERED_COUNT"
          echo "Resolved:   $TOTAL_COUNT"
          echo "NEW:        $NEW_COUNT"

          if [ "$NEW_COUNT" -gt 0 ]; then
            echo ""
            echo "NEW SUBDOMAINS:"
            cat results/new.txt
          fi

          # Permanent historical database
          cat results/resolved.txt >> all_subs.txt
          sort -u all_subs.txt -o all_subs.txt

          # Current DNS-resolving database
          cp results/resolved.txt resolved_subs.txt

      # ---------------------------------------------------------
      # Final Telegram report
      # ---------------------------------------------------------

      - name: Telegram final report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          NEW_COUNT="${{ steps.process.outputs.NEW_COUNT }}"
          TOTAL_COUNT="${{ steps.process.outputs.TOTAL_COUNT }}"
          DISCOVERED_COUNT="${{ steps.process.outputs.DISCOVERED_COUNT }}"

          if [ "$NEW_COUNT" -gt 0 ]; then

            HEADER="🚨 NEW SUBDOMAINS FOUND"

            BODY="📊 Discovered: ${DISCOVERED_COUNT}%0A"
            BODY="${BODY}🌐 Resolving: ${TOTAL_COUNT}%0A"
            BODY="${BODY}🆕 New: ${NEW_COUNT}%0A"
            BODY="${BODY}📅 $(date '+%Y-%m-%d')%0A%0A"

            while IFS= read -r sub; do
              BODY="${BODY}${sub}%0A"
            done < results/new.txt

          else

            HEADER="✅ Recon completed"

            BODY="📊 Discovered: ${DISCOVERED_COUNT}%0A"
            BODY="${BODY}🌐 Resolving: ${TOTAL_COUNT}%0A"
            BODY="${BODY}🆕 New: 0%0A"
            BODY="${BODY}📅 $(date '+%Y-%m-%d')%0A%0A"
            BODY="${BODY}No new resolving subdomains."

          fi

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${HEADER}%0A%0A${BODY}" \
            -d disable_web_page_preview=true

      # ---------------------------------------------------------
      # Commit historical data
      # ---------------------------------------------------------

      - name: Commit history
        if: steps.process.outputs.NEW_COUNT != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add all_subs.txt resolved_subs.txt

          git commit \
            -m "Update subdomain history - $(date +%Y-%m-%d)" \
            || echo "No changes"

          git push
