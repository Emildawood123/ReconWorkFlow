
name: Passive Subdomain Monitor

on:
  schedule:
    - cron: "55 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.22"

jobs:
  monitor:
    runs-on: ubuntu-latest

    # Keep the workflow safely below GitHub's 1-hour limit.
    timeout-minutes: 50

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # GO
      # ============================================================

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # ============================================================
      # INSTALL TOOLS
      # ============================================================

      - name: Install tools
        shell: bash
        run: |
          set -e

          echo "$HOME/go/bin" >> "$GITHUB_PATH"

          echo "Installing Subfinder..."
          timeout 5m go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest

          echo "Installing DNSx..."
          timeout 5m go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest

          echo "Installing Assetfinder..."
          timeout 5m go install github.com/tomnomnom/assetfinder@latest

          echo "Installing Amass..."
          timeout 8m go install github.com/owasp-amass/amass/v4/...@master

          echo "Checking installed tools..."

          command -v subfinder || true
          command -v dnsx || true
          command -v assetfinder || true
          command -v amass || true

      # ============================================================
      # PREPARE
      # ============================================================

      - name: Prepare
        shell: bash
        run: |
          set -e

          mkdir -p results

          touch all_subs.txt
          touch resolved_subs.txt

          if [ ! -f root.txt ]; then
            echo "ERROR: root.txt does not exist."
            exit 1
          fi

          sed -i 's/\r//' root.txt
          sed -i '/^[[:space:]]*$/d' root.txt

          echo "Targets:"
          cat root.txt

          TARGET_COUNT=$(wc -l < root.txt | tr -d ' ')

          echo "Target count: $TARGET_COUNT"

          if [ "$TARGET_COUNT" -eq 0 ]; then
            echo "ERROR: root.txt is empty."
            exit 1
          fi

      # ============================================================
      # TELEGRAM REMINDER
      # ============================================================

      - name: Telegram reminder
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -e

          MESSAGE='🔔 Recon starts in 5 minutes

          ⏰ Scheduled scan: 6:00 PM Egypt
          🎯 Passive subdomain monitoring

          🔎 Subfinder
          🔎 Amass passive
          🔎 Assetfinder
          🌐 DNS validation'

          RESPONSE=$(timeout 30s curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true")

          echo "$RESPONSE"

      # ============================================================
      # WAIT
      # ============================================================

      - name: Wait 5 minutes
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          sleep 300

      # ============================================================
      # TELEGRAM STARTED
      # ============================================================

      - name: Telegram started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -e

          MESSAGE='🚀 Recon started

          🔎 Subfinder
          🔎 Amass passive
          🔎 Assetfinder
          🌐 DNS validation

          ⏳ Running passive discovery...'

          RESPONSE=$(timeout 30s curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true")

          echo "$RESPONSE"

      # ============================================================
      # SUBFINDER
      # Maximum runtime: 8 minutes
      # ============================================================

      - name: Subfinder
        shell: bash
        run: |
          set +e

          : > results/subfinder.txt
          : > results/subfinder.log

          echo "Starting Subfinder..."

          timeout 8m subfinder \
            -dL root.txt \
            -all \
            -silent \
            -o results/subfinder.txt \
            > results/subfinder.log 2>&1

          STATUS=$?

          echo "Subfinder exit status: $STATUS"

          if [ "$STATUS" -eq 124 ]; then
            echo "Subfinder reached its 8 minute timeout."
          fi

          COUNT=$(wc -l < results/subfinder.txt | tr -d ' ')

          echo "Subfinder results: $COUNT"

      # ============================================================
      # ASSETFINDER
      # Maximum runtime: 8 minutes
      # ============================================================

      - name: Assetfinder
        shell: bash
        run: |
          set +e

          : > results/assetfinder.txt
          : > results/assetfinder.log

          echo "Starting Assetfinder..."

          timeout 8m bash -c '
            while IFS= read -r domain; do
              if [ -n "$domain" ]; then
                assetfinder --subs-only "$domain"
              fi
            done < root.txt
          ' > results/assetfinder.txt 2> results/assetfinder.log

          STATUS=$?

          echo "Assetfinder exit status: $STATUS"

          if [ "$STATUS" -eq 124 ]; then
            echo "Assetfinder reached its 8 minute timeout."
          fi

          COUNT=$(wc -l < results/assetfinder.txt | tr -d ' ')

          echo "Assetfinder results: $COUNT"

      # ============================================================
      # AMASS
      # Maximum runtime: 10 minutes
      # ============================================================

      - name: Amass passive
        shell: bash
        run: |
          set +e

          : > results/amass.txt
          : > results/amass.log

          echo "Starting Amass passive enumeration..."

          timeout 10m amass enum \
            -passive \
            -df root.txt \
            -o results/amass.txt \
            > results/amass.log 2>&1

          STATUS=$?

          echo "Amass exit status: $STATUS"

          if [ "$STATUS" -eq 124 ]; then
            echo "Amass reached its 10 minute timeout."
          fi

          COUNT=$(wc -l < results/amass.txt | tr -d ' ')

          echo "Amass results: $COUNT"

      # ============================================================
      # COMBINE
      # ============================================================

      - name: Combine discoveries
        shell: bash
        run: |
          set -e

          touch results/subfinder.txt
          touch results/amass.txt
          touch results/assetfinder.txt

          echo "Combining results..."

          cat \
            results/subfinder.txt \
            results/amass.txt \
            results/assetfinder.txt \
            | sed 's/\r//' \
            | sed 's/^[[:space:]]*//' \
            | sed 's/[[:space:]]*$//' \
            | tr '[:upper:]' '[:lower:]' \
            | grep -E '^[a-z0-9][a-z0-9._*-]*\.[a-z0-9.-]+$' \
            | sort -u \
            > results/discovered.txt

          DISCOVERED_COUNT=$(wc -l < results/discovered.txt | tr -d ' ')

          echo "================================"
          echo "Total discovered: $DISCOVERED_COUNT"
          echo "================================"

          echo "First results:"
          head -50 results/discovered.txt || true

      # ============================================================
      # DNS VALIDATION
      # Maximum runtime: 8 minutes
      # ============================================================

      - name: DNS validation
        shell: bash
        run: |
          set +e

          : > results/resolved.txt

          if [ -s results/discovered.txt ]; then

            echo "Starting DNS validation..."

            timeout 8m dnsx \
              -l results/discovered.txt \
              -silent \
              -o results/resolved.txt

            STATUS=$?

            echo "DNSx exit status: $STATUS"

            if [ "$STATUS" -eq 124 ]; then
              echo "DNSx reached its 8 minute timeout."
            fi

          else
            echo "No discovered subdomains to resolve."
          fi

          sort -u results/resolved.txt -o results/resolved.txt

          RESOLVED_COUNT=$(wc -l < results/resolved.txt | tr -d ' ')

          echo "Resolved: $RESOLVED_COUNT"

      # ============================================================
      # FIND NEW
      # ============================================================

      - name: Find new subdomains
        id: process
        shell: bash
        run: |
          set -e

          touch all_subs.txt
          touch resolved_subs.txt
          touch results/discovered.txt
          touch results/resolved.txt
          touch results/new.txt

          sort -u all_subs.txt \
            | sed '/^[[:space:]]*$/d' \
            > results/history.txt

          comm \
            -13 \
            results/history.txt \
            results/discovered.txt \
            > results/new.txt

          DISCOVERED_COUNT=$(wc -l < results/discovered.txt | tr -d ' ')
          RESOLVED_COUNT=$(wc -l < results/resolved.txt | tr -d ' ')
          NEW_COUNT=$(wc -l < results/new.txt | tr -d ' ')

          echo "DISCOVERED_COUNT=$DISCOVERED_COUNT" >> "$GITHUB_OUTPUT"
          echo "RESOLVED_COUNT=$RESOLVED_COUNT" >> "$GITHUB_OUTPUT"
          echo "NEW_COUNT=$NEW_COUNT" >> "$GITHUB_OUTPUT"

          echo "================================"
          echo "Discovered: $DISCOVERED_COUNT"
          echo "Resolved:   $RESOLVED_COUNT"
          echo "New:        $NEW_COUNT"
          echo "================================"

          echo "New subdomains:"
          cat results/new.txt || true

          # Update history
          cat results/discovered.txt >> all_subs.txt
          sort -u all_subs.txt -o all_subs.txt

          # Update resolved history
          cp results/resolved.txt resolved_subs.txt

      # ============================================================
      # TELEGRAM FINAL RESULTS
      # ============================================================

      - name: Telegram final results
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set +e

          mkdir -p results

          touch results/new.txt
          touch results/discovered.txt
          touch results/resolved.txt

          NEW_COUNT="${{ steps.process.outputs.NEW_COUNT }}"
          DISCOVERED_COUNT="${{ steps.process.outputs.DISCOVERED_COUNT }}"
          RESOLVED_COUNT="${{ steps.process.outputs.RESOLVED_COUNT }}"

          [ -z "$NEW_COUNT" ] && NEW_COUNT="0"
          [ -z "$DISCOVERED_COUNT" ] && DISCOVERED_COUNT="0"
          [ -z "$RESOLVED_COUNT" ] && RESOLVED_COUNT="0"

          if [ "$NEW_COUNT" -gt 0 ]; then

            MESSAGE="🚨 Recon completed

          📊 Discovered: ${DISCOVERED_COUNT}
          🌐 Resolved: ${RESOLVED_COUNT}
          🆕 New: ${NEW_COUNT}

          🆕 New subdomains:"

            while IFS= read -r sub; do
              if [ -n "$sub" ]; then
                MESSAGE="${MESSAGE}
          ${sub}"
              fi
            done < results/new.txt

          else

            MESSAGE="✅ Recon completed

          📊 Discovered: ${DISCOVERED_COUNT}
          🌐 Resolved: ${RESOLVED_COUNT}
          🆕 New: 0

          ✅ No new subdomains found."

          fi

          echo "================================"
          echo "Telegram report:"
          printf '%s\n' "$MESSAGE"
          echo "================================"

          RESPONSE=$(timeout 30s curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true")

          echo "Telegram API response:"
          echo "$RESPONSE"

      # ============================================================
      # COMMIT HISTORY
      # ============================================================

      - name: Commit history
        if: always()
        shell: bash
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          touch all_subs.txt
          touch resolved_subs.txt

          git add all_subs.txt resolved_subs.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Update subdomain history - $(date '+%Y-%m-%d')"

          git push

      # ============================================================
      # UPLOAD RESULTS
      # ============================================================

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-results-${{ github.run_number }}
          path: results/
          retention-days: 7

