```yaml
name: Passive Subdomain Monitor

on:
  schedule:
    # 5:55 PM Egypt time (UTC+3)
    - cron: '55 14 * * *'

  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.22'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # =========================================================
      # Checkout
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # Go
      # =========================================================

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # =========================================================
      # Install passive discovery tools
      # =========================================================

      - name: Install tools
        shell: bash
        run: |
          set -e

          echo "$HOME/go/bin" >> "$GITHUB_PATH"

          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/tomnomnom/assetfinder@latest

          go install github.com/owasp-amass/amass/v4/...@master

      # =========================================================
      # Prepare
      # =========================================================

      - name: Prepare
        run: |
          mkdir -p results

          touch all_subs.txt
          touch resolved_subs.txt

          sed -i 's/\r//' root.txt

          echo "=============================="
          echo "Targets"
          echo "=============================="

          cat root.txt

      # =========================================================
      # Telegram reminder
      # =========================================================

      - name: Telegram reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔔 Recon starts in 5 minutes%0A%0A⏰ 6:00 PM Egypt%0A🎯 Passive subdomain monitoring" \
            -d disable_web_page_preview=true

      # =========================================================
      # Wait until 6 PM
      # =========================================================

      - name: Wait 5 minutes
        run: |
          sleep 300

      # =========================================================
      # Telegram scan started
      # =========================================================

      - name: Telegram started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚀 Recon started%0A%0A🔎 Subfinder%0A🔎 Amass passive%0A🔎 Assetfinder%0A🌐 DNS validation" \
            -d disable_web_page_preview=true

      # =========================================================
      # Passive discovery — RUN IN PARALLEL
      # =========================================================

      - name: Passive discovery
        shell: bash
        run: |
          set +e

          mkdir -p results

          # -------------------------
          # Subfinder
          # -------------------------

          (
            subfinder \
              -dL root.txt \
              -all \
              -silent \
              -o results/subfinder.txt
          ) > results/subfinder.log 2>&1 &

          PID_SUBFINDER=$!

          # -------------------------
          # Amass passive
          # -------------------------

          (
            amass enum \
              -passive \
              -df root.txt \
              -o results/amass.txt
          ) > results/amass.log 2>&1 &

          PID_AMASS=$!

          # -------------------------
          # Assetfinder
          # -------------------------

          (
            while IFS= read -r domain; do

              [ -z "$domain" ] && continue

              assetfinder \
                --subs-only "$domain" || true

            done < root.txt

          ) > results/assetfinder.txt 2> results/assetfinder.log &

          PID_ASSETFINDER=$!

          # Wait for all sources

          wait $PID_SUBFINDER
          SUBFINDER_STATUS=$?

          wait $PID_AMASS
          AMASS_STATUS=$?

          wait $PID_ASSETFINDER
          ASSETFINDER_STATUS=$?

          echo ""
          echo "=============================="
          echo "Discovery completed"
          echo "=============================="

          echo "Subfinder:   $SUBFINDER_STATUS"
          echo "Amass:       $AMASS_STATUS"
          echo "Assetfinder: $ASSETFINDER_STATUS"

      # =========================================================
      # Combine + deduplicate
      # =========================================================

      - name: Combine discoveries
        run: |
          cat \
            results/subfinder.txt \
            results/amass.txt \
            results/assetfinder.txt \
            2>/dev/null \
            | sed 's/\r//' \
            | sed 's/^[[:space:]]*//' \
            | sed 's/[[:space:]]*$//' \
            | tr '[:upper:]' '[:lower:]' \
            | grep -E '^[a-z0-9*._-]+\.[a-z]{2,}$' \
            | sort -u \
            > results/discovered.txt

          DISCOVERED=$(wc -l < results/discovered.txt | tr -d ' ')

          echo "Unique discovered: $DISCOVERED"

      # =========================================================
      # DNS validation
      # =========================================================

      - name: DNS validation
        run: |
          if [ -s results/discovered.txt ]; then

            dnsx \
              -l results/discovered.txt \
              -silent \
              -o results/resolved.txt \
              || true

          else
            touch results/resolved.txt
          fi

          sort -u results/resolved.txt \
            -o results/resolved.txt

          RESOLVED=$(wc -l < results/resolved.txt | tr -d ' ')

          echo "Currently resolving: $RESOLVED"

      # =========================================================
      # Compare against historical results
      # =========================================================

      - name: Find new subdomains
        id: process
        shell: bash
        run: |
          sort -u all_subs.txt \
            > results/history.txt

          comm -13 \
            results/history.txt \
            results/resolved.txt \
            > results/new.txt

          NEW_COUNT=$(wc -l < results/new.txt | tr -d ' ')
          DISCOVERED_COUNT=$(wc -l < results/discovered.txt | tr -d ' ')
          RESOLVED_COUNT=$(wc -l < results/resolved.txt | tr -d ' ')

          echo "NEW_COUNT=$NEW_COUNT" >> "$GITHUB_OUTPUT"
          echo "DISCOVERED_COUNT=$DISCOVERED_COUNT" >> "$GITHUB_OUTPUT"
          echo "RESOLVED_COUNT=$RESOLVED_COUNT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=============================="
          echo "FINAL RESULTS"
          echo "=============================="
          echo "Discovered: $DISCOVERED_COUNT"
          echo "Resolved:   $RESOLVED_COUNT"
          echo "New:        $NEW_COUNT"

          if [ "$NEW_COUNT" -gt 0 ]; then
            echo ""
            echo "NEW SUBDOMAINS:"
            cat results/new.txt
          fi

          # Permanent history
          cat results/resolved.txt >> all_subs.txt
          sort -u all_subs.txt -o all_subs.txt

          # Current resolving hosts
          cp results/resolved.txt resolved_subs.txt

      # =========================================================
      # Telegram result
      # =========================================================

      - name: Telegram results
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          NEW_COUNT="${{ steps.process.outputs.NEW_COUNT }}"
          DISCOVERED_COUNT="${{ steps.process.outputs.DISCOVERED_COUNT }}"
          RESOLVED_COUNT="${{ steps.process.outputs.RESOLVED_COUNT }}"

          if [ "$NEW_COUNT" -gt 0 ]; then

            TEXT="🚨 NEW SUBDOMAINS FOUND%0A%0A"
            TEXT="${TEXT}📊 Discovered: ${DISCOVERED_COUNT}%0A"
            TEXT="${TEXT}🌐 Resolving: ${RESOLVED_COUNT}%0A"
            TEXT="${TEXT}🆕 New: ${NEW_COUNT}%0A"
            TEXT="${TEXT}📅 $(date '+%Y-%m-%d')%0A%0A"

            while IFS= read -r sub; do
              TEXT="${TEXT}${sub}%0A"
            done < results/new.txt

          else

            TEXT="✅ Recon completed%0A%0A"
            TEXT="${TEXT}📊 Discovered: ${DISCOVERED_COUNT}%0A"
            TEXT="${TEXT}🌐 Resolving: ${RESOLVED_COUNT}%0A"
            TEXT="${TEXT}🆕 New: 0%0A%0A"
            TEXT="${TEXT}No new resolving subdomains."

          fi

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d disable_web_page_preview=true

      # =========================================================
      # Commit history
      # =========================================================

      - name: Commit history
        if: steps.process.outputs.NEW_COUNT != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add all_subs.txt resolved_subs.txt

          git commit \
            -m "Update subdomain history - $(date '+%Y-%m-%d')" \
            || echo "No changes"

          git push
```
